<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="leaflet.css" />
<style>
html, body, #map { height: 100%; margin: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
var map = L.map('map').setView([23.8103, 90.4125], 12);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var destinationMarker = null;
var agentMarker = null;
var routeLine = null;

window.setDestination = function (lat, lng) {
  if (destinationMarker) {
    map.removeLayer(destinationMarker);
  }
  destinationMarker = L.circleMarker([lat, lng], {
    radius: 8,
    color: '#c0392b',
    fillColor: '#c0392b',
    fillOpacity: 1
  }).addTo(map);
};

window.setRoute = function (coordsJson) {
  var coords = JSON.parse(coordsJson);
  if (routeLine) {
    map.removeLayer(routeLine);
  }
  routeLine = L.polyline(coords, { color: '#2980b9', weight: 4 }).addTo(map);
  map.fitBounds(routeLine.getBounds());
};

window.updateAgent = function (lat, lng) {
  if (agentMarker) {
    agentMarker.setLatLng([lat, lng]);
  } else {
    agentMarker = L.circleMarker([lat, lng], {
      radius: 8,
      color: '#27ae60',
      fillColor: '#27ae60',
      fillOpacity: 1
    }).addTo(map);
  }
};

MapChannel.postMessage('ready');
</script>
</body>
</html>

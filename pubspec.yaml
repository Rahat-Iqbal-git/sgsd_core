name: sgsd_core
description: Secure Geo-Sync Dispatch Core
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  dio: ^5.11.0
  drift: ^2.34.4
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  get_it: ^9.2.1
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.0
  webview_flutter: ^4.14.1
dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/map/

# hook setting for sqlcipher 
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
